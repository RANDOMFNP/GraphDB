# GENERATED BY AI
# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    strategy:
      fail-fast: false

      matrix:
        include:

          # Ubuntu + GCC 14
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release

          # Ubuntu + Clang 18
          - os: ubuntu-latest
            c_compiler: clang-18
            cpp_compiler: clang++-18
            build_type: Release

          # Windows + MSVC
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:

    # Download repository
    - name: Checkout
      uses: actions/checkout@v4


    # Set up MSVC environment
    - name: Set up MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1


    # Show compiler version
    - name: Show compiler
      shell: bash
      run: |
        echo "C compiler: ${{ matrix.c_compiler }}"
        echo "C++ compiler: ${{ matrix.cpp_compiler }}"

        if [ "${{ matrix.c_compiler }}" = "gcc-14" ]; then
          gcc-14 --version
          g++-14 --version

        elif [ "${{ matrix.c_compiler }}" = "clang-18" ]; then
          clang-18 --version
          clang++-18 --version

        else
          cl
        fi


    # Configure CMake
    #
    # -S . means the current repository directory.
    # This avoids Windows/Bash path conversion problems.
    - name: Configure CMake
      run: cmake -G Ninja -B build -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF -S .


    # Build
    #
    # Ninja is single-configuration, so --config is unnecessary.
    - name: Build
      run: cmake --build build --parallel


    # Test
    - name: Test
      working-directory: build
      run: ctest --output-on-failure
