# GENERATED BY AI
# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Ubuntu + GCC 14
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Release

          # Ubuntu + Clang 18
          - os: ubuntu-latest
            c_compiler: clang-18
            cpp_compiler: clang++-18
            build_type: Release

          # Windows + MSVC
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:

    # Check out the repository
    - uses: actions/checkout@v4


    # Set up Developer Command Prompt for MSVC on Windows
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1


    # Set reusable strings
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"


    # Show the compiler version
    - name: Show compiler version
      shell: bash
      run: |
        echo "C compiler: ${{ matrix.c_compiler }}"
        echo "C++ compiler: ${{ matrix.cpp_compiler }}"

        if [ "${{ matrix.c_compiler }}" = "gcc-14" ]; then
          gcc-14 --version
          g++-14 --version
        elif [ "${{ matrix.c_compiler }}" = "clang-18" ]; then
          clang-18 --version
          clang++-18 --version
        else
          cl
        fi


    # Configure CMake
    #
    # Ninja is a single-configuration generator, so the Release
    # configuration is selected here instead of using --config later.
    - name: Configure CMake
      shell: bash
      run: >
        cmake -G Ninja
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_STANDARD=23
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -DCMAKE_CXX_EXTENSIONS=OFF
        -S ${{ github.workspace }}


    # Build the project
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel


    # Run the tests
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --output-on-failure
