
# GENERATED BY AI
# This workflow builds and tests the CMake project on multiple platforms
# using specific compiler versions.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          # Windows uses MSVC
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

          # Ubuntu uses GCC 16
          - os: ubuntu-latest
            c_compiler: gcc-16
            cpp_compiler: g++-16

          # Ubuntu uses Clang 18
          - os: ubuntu-latest
            c_compiler: clang-18
            cpp_compiler: clang++-18

        exclude:
          - os: windows-latest
            c_compiler: gcc

          - os: windows-latest
            c_compiler: clang

          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    # Install GCC 16 on Ubuntu
    - name: Install GCC 16
      if: matrix.c_compiler == 'gcc-16'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-16 g++-16

    # Install Clang 18 on Ubuntu
    - name: Install Clang 18
      if: matrix.c_compiler == 'clang-18'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18

    # Set up Developer Command Prompt explicitly for MSVC (cl) on Windows
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # Display the compiler version being used
    - name: Show compiler version
      shell: bash
      run: |
        if [ "${{ matrix.c_compiler }}" = "gcc-16" ]; then
          g++-16 --version
        elif [ "${{ matrix.c_compiler }}" = "clang-18" ]; then
          clang++-18 --version
        else
          cl
        fi

    # Configure CMake with C++23 enabled
    - name: Configure CMake
      run: >
        cmake -G Ninja -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_STANDARD=23
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -S ${{ github.workspace }}

    # Build the project
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    # Run tests and show detailed output if anything fails
    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
